<!DOCTYPE html>
<html>
<head>
  <title>Q2 Seatwork 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    h1 { color: #800000; }
    body { padding-top: 20px; padding-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">

    <h1>OBMC Contact Us Page</h1>
    <p>We would love to hear from you. Send us a message or use the details below.</p>
    <hr>

    <div class="row">

      <div class="col">
        <h2>Send Us a Message</h2>
        <form>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>

      <div class="col">
        <h2>Contact Information</h2>
        <table class="table table-striped table-bordered">
          <tr>
            <th>Contact</th>
            <th>Details</th>
          </tr>
          <tr>
            <td>Address</td>
            <td>OBMC Campus, angeles city</td>
          </tr>
          <tr>
            <td>Phone</td>
            <td>(088) 123-4567</td>
          </tr>
          <tr>
            <td>Email</td>
            <td>info@obmc.edu.ph</td>
          </tr>
          <tr>
            <td>Office Hours</td>
            <td>Mon-Fri, 8:00 AM - 5:00 PM</td>
          </tr>
        </table>
      </div>

    </div>
  </div>
</body>
</html>
